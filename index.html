<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover draws under the notch and home bar; src/app/theme.css adds the safe-area padding. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="PageNest: free, private reader and audiobook player. No account needed." />
    <title>PageNest</title>

    <!-- Browser bar colour: the default is the Light page colour; the two media tags follow the system theme (blueprint 5.2). -->
    <meta name="theme-color" content="#FAFAF7" />
    <meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17181C" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />

    <!-- iPhone and iPad: Add to Home Screen (blueprint 14) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PageNest" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Boot screen: painted with the page stylesheet, before any script has run, so the first paint does not wait for the
         app code. React replaces it on the first render. Inline style only (the CSP has no inline scripts). -->
    <style>
      #pn-boot {
        display: flex;
        box-sizing: border-box;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: rgb(var(--pn-page, 250 250 247));
        color: rgb(var(--pn-muted, 92 92 88));
        font: 600 1.25rem/1.2 Georgia, 'Times New Roman', serif;
        letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="pn-boot" aria-hidden="true">PageNest</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
