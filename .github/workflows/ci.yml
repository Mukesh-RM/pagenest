name: CI

# Runs on every pull request and every push. Free-tier friendly:
# one Ubuntu job, npm and Playwright browser caches, cancel superseded runs,
# Chromium + WebKit only, short timeout.
#
# The product (repo root) and the QA suite (tests/, its own package) each have
# their own package.json and lockfile. The QA suite builds the app itself
# through Playwright's webServer (npm run build && vite preview on port 4173)
# and Lighthouse audits the root dist/ folder produced by the build step.

on:
  push:
  pull_request:

# Superseded runs of a branch or PR are cancelled to save free-tier minutes.
# Every push to main gets its own group (the commit SHA) so a quick follow-up
# merge never cancels the run that validates the previous main commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CI: "true"
  # PageNest never sends telemetry; keep tooling quiet too.
  WRANGLER_SEND_METRICS: "false"

jobs:
  verify:
    name: Install, lint, test, build, e2e, lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Detect project files
        id: detect
        run: |
          has_app=false
          has_build=false
          has_e2e=false
          if [ -f package.json ]; then
            has_app=true
            if node -e 'process.exit(require("./package.json").scripts?.build ? 0 : 1)'; then
              has_build=true
            else
              echo "::notice::Root package.json has no build script yet; build, e2e and Lighthouse are skipped."
            fi
          else
            echo "::notice::No package.json yet; app jobs are skipped until the Vite project lands."
          fi
          if [ "$has_build" = true ]; then
            if [ ! -f package-lock.json ]; then
              echo "::error::package-lock.json is missing at the repo root; npm ci needs it. Commit the lockfile."
              exit 1
            fi
            if [ -f tests/package.json ] && [ -f tests/playwright.config.ts ]; then
              if [ ! -f tests/package-lock.json ]; then
                echo "::error::tests/package-lock.json is missing; npm ci needs it. Commit the lockfile."
                exit 1
              fi
              has_e2e=true
            else
              echo "::notice::tests/ package not found; e2e and Lighthouse are skipped."
            fi
          fi
          {
            echo "has_app=$has_app"
            echo "has_build=$has_build"
            echo "has_e2e=$has_e2e"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.detect.outputs.has_app == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.has_app == 'true'
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.has_app == 'true'
        run: npm run lint --if-present

      - name: Type check
        if: steps.detect.outputs.has_app == 'true'
        run: npm run typecheck --if-present

      - name: Unit tests
        if: steps.detect.outputs.has_app == 'true'
        run: npm test --if-present

      - name: Build
        if: steps.detect.outputs.has_build == 'true'
        run: npm run build

      - name: Install QA suite dependencies
        if: steps.detect.outputs.has_e2e == 'true'
        working-directory: tests
        run: npm ci

      - name: Cache Playwright browsers
        if: steps.detect.outputs.has_e2e == 'true'
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-webkit-${{ hashFiles('tests/package-lock.json') }}

      - name: Install Playwright browsers (Chromium and WebKit)
        if: steps.detect.outputs.has_e2e == 'true'
        working-directory: tests
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            # Browsers came from the cache; only the OS libraries are missing.
            npx playwright install-deps chromium webkit
          else
            npx playwright install --with-deps chromium webkit
          fi

      - name: Playwright tests (smoke, PWA, offline, accessibility)
        if: steps.detect.outputs.has_e2e == 'true'
        working-directory: tests
        run: npm test

      - name: Lighthouse gate (PWA and Accessibility >= 90) on the production build
        if: steps.detect.outputs.has_e2e == 'true'
        working-directory: tests
        run: npm run lighthouse

      - name: Upload Playwright and Lighthouse reports on failure
        if: failure() && steps.detect.outputs.has_e2e == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            tests/playwright-report/
            tests/test-results/
            tests/lighthouse/reports/
          if-no-files-found: ignore
          retention-days: 7
